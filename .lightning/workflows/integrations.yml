trigger:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

machine: "L4"
timeout: "35" # minutes
parametrize:
  matrix:
    image: # the lowest torch here must match the floor in requirements/base.txt, as it also drives the oldest requirements
      - "pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime"
      - "pytorch/pytorch:2.10.0-cuda13.0-cudnn9-runtime"

env:
  # the newer `pytorch/pytorch` images ship a PEP 668 "externally managed" system python
  PIP_BREAK_SYSTEM_PACKAGES: "1"

run: |
  whereis nvidia
  nvidia-smi
  python --version
  pip --version
  pip install -q fire wget packaging
  set -ex

  image_tmp="${image##*cuda}" # Remove everything up to and including "cuda"
  CUDA_VERSION="${image_tmp%%-*}" # Extract the CUDA version up to the first hyphen
  CUDA_VERSION_MM="${CUDA_VERSION//'.'/''}"
  image_tmp="${image##*:}" # Remove everything up to and including ":"
  TORCH_VERSION="${image_tmp%%-*}" # Extract the torch version from the image name
  TORCH_VER_M_M="${TORCH_VERSION%.*}" # Get major.minor by removing the last dot and everything after
  TORCH_URL="https://download.pytorch.org/whl/cu${CUDA_VERSION_MM}/torch_stable.html"
  echo ${TORCH_URL}

  # read the torch floor from the requirements, so raising it on CPU cannot leave these GPU lanes behind
  # note: must run before `adjust-torch-versions.py` below, which rewrites the pin to an exact version
  TORCH_MIN=$(grep -oE '^torch >=[0-9]+\.[0-9]+' requirements/base.txt | grep -oE '[0-9]+\.[0-9]+$' || true)
  [ -n "${TORCH_MIN}" ] || { echo "ERROR: could not read the torch floor from requirements/base.txt"; exit 1; }
  echo "Torch floor from requirements/base.txt: ${TORCH_MIN}"
  python -c "import sys; from packaging.version import Version; sys.exit(0 if Version('${TORCH_VER_M_M}') >= Version('${TORCH_MIN}') else 1)" || {
    echo "ERROR: image provides torch ${TORCH_VER_M_M}, below the ${TORCH_MIN} floor in requirements/base.txt."
    echo "       Bump the images in .lightning/workflows/ together with the floor."
    exit 1
  }

  if [ "${TORCH_VER_M_M}" == "${TORCH_MIN}" ]; then
    pip install -q 'lightning-utilities[cli]'
    python .github/assistant.py set-oldest-versions --req_files='["requirements/_integrate.txt"]'
    cat requirements/_integrate.txt
  fi

  python -m wget https://raw.githubusercontent.com/Lightning-AI/utilities/main/scripts/adjust-torch-versions.py
  for fpath in `ls requirements/*.txt`; do
      # torch version shall be sourced based on the used docker
      python adjust-torch-versions.py $fpath
  done

  pip install -q -r requirements/_integrate.txt
  # force reinstall TM as it could be overwritten by integration's dependencies
  pip install . -U -r requirements/_tests.txt --find-links ${TORCH_URL}

  pip list
  python -c "from torch import __version__ as ver ; assert '.'.join(str(ver).split('.')[:2]) == '${TORCH_VER_M_M}', f'PyTorch: {ver}'"
  python -c "import torch ; mgpu = torch.cuda.device_count() ; assert mgpu >= 1, f'found GPUs: {mgpu}'"

  pytest tests/integrations/ -v --durations=50 --timeout=360
